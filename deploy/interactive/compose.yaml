name: dml-interactive

x-management-env: &management-env
  HM_DATABASE_URL: sqlite:////state/management.sqlite
  HM_HEADSCALE_URL: ${HM_HEADSCALE_URL:?set verified reachable administrative HTTPS URL}
  HM_LOGIN_SERVER: ${HM_LOGIN_SERVER:?set verified Headscale HTTPS login URL}
  HM_HEADSCALE_KEY_FILE: /secrets/headscale
  HM_CONTROLLER_SECRET_FILE: /secrets/controller
  HM_GATEWAY_SECRET_FILE: /secrets/gateway
  HM_BOOTSTRAP_SECRET_FILE: /secrets/bootstrap
  HM_ENCRYPTION_KEY_FILE: /secrets/encryption
  HM_SIGNING_KEY_FILE: /secrets/signing.pem
  HM_VERIFICATION_KEYS_FILE: /secrets/public.json
  HM_SIGNING_KID: ${HM_SIGNING_KID:-primary}
  HM_REQUIRED_POLICY_FILE: /required-policy.json
  GATEWAY_ID: ${GATEWAY_ID:?set persistent gateway identity}
  GATEWAY_GENERATION: ${GATEWAY_GENERATION:?set persistent gateway generation}
x-management-mounts: &management-mounts
  - management-state:/state
  - ${INTERACTIVE_SECRET_DIR:?}/headscale:/secrets/headscale:ro
  - ${INTERACTIVE_SECRET_DIR}/controller:/secrets/controller:ro
  - ${INTERACTIVE_SECRET_DIR}/gateway:/secrets/gateway:ro
  - ${INTERACTIVE_SECRET_DIR}/bootstrap:/secrets/bootstrap:ro
  - ${INTERACTIVE_SECRET_DIR}/encryption:/secrets/encryption:ro
  - ${INTERACTIVE_SECRET_DIR}/signing.pem:/secrets/signing.pem:ro
  - ${INTERACTIVE_SECRET_DIR}/public.json:/secrets/public.json:ro
  - ./deploy/interactive/required-policy.json:/required-policy.json:ro
x-gateway-env: &gateway-env
  GW_MANAGEMENT_URL: http://management:8020
  HM_GATEWAY_SECRET_FILE: /secrets/gateway
  GW_VERIFICATION_KEYS_FILE: /secrets/public.json
  GW_ORIGINS: ${GW_ORIGINS:?set HTTPS browser Origin allowlist}
  GW_ALLOW_CLI: ${GW_ALLOW_CLI:-0}
  GATEWAY_ID: ${GATEWAY_ID:?}
  GATEWAY_GENERATION: ${GATEWAY_GENERATION:?}
x-runtime: &runtime
  restart: unless-stopped
  stop_grace_period: 30s
  cpus: '1.0'
  mem_limit: 512m
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: '3'}

services:
  management:
    <<: *runtime
    image: dml-interactive-management:local
    build: Headscale_Management
    environment: *management-env
    extra_hosts: ["${HM_HEADSCALE_HOST_OVERRIDE:-headscale-host.internal}:${HM_HEADSCALE_HOST_IP:-host-gateway}"]
    volumes: *management-mounts
    networks: [control]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8020/health/ready',timeout=4)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
  migrate:
    image: dml-interactive-management:local
    command: [python, -m, headscale_management.database]
    environment: *management-env
    extra_hosts: ["${HM_HEADSCALE_HOST_OVERRIDE:-headscale-host.internal}:${HM_HEADSCALE_HOST_IP:-host-gateway}"]
    volumes: *management-mounts
    networks: [control]
    restart: 'no'
  tailscale:
    <<: *runtime
    image: tailscale/tailscale:v1.102.3@sha256:8c42c4574ab066384fcb72f69e086a2ff1dd3652eb6f56856cee34bcf0d2f680
    entrypoint: [tailscaled]
    command: [--tun=userspace-networking, --state=/state/tailscaled.state, --socket=/var/run/tailscale/tailscaled.sock, --socks5-server=127.0.0.1:1055]
    environment: {TS_NO_LOGS_NO_SUPPORT: 'true'}
    networks: [control]
    ports: ['127.0.0.1:${GATEWAY_PORT:-8030}:8030']
    volumes: [tailscale-state:/state, tailscale-socket:/var/run/tailscale]
    healthcheck:
      test: [CMD-SHELL, 'test -S /var/run/tailscale/tailscaled.sock && nc -z 127.0.0.1 1055']
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
  bootstrap:
    image: dml-interactive-gateway:local
    user: '0:10001'
    command: [python, -m, interactive_gateway.bootstrap]
    environment:
      <<: *gateway-env
      HM_BOOTSTRAP_SECRET_FILE: /secrets/bootstrap
    network_mode: service:tailscale
    volumes:
      - tailscale-socket:/var/run/tailscale
      - bootstrap-state:/bootstrap
      - ${INTERACTIVE_SECRET_DIR}/gateway:/secrets/gateway:ro
      - ${INTERACTIVE_SECRET_DIR}/bootstrap:/secrets/bootstrap:ro
      - ${INTERACTIVE_SECRET_DIR}/public.json:/secrets/public.json:ro
    restart: 'no'
  gateway:
    <<: *runtime
    image: dml-interactive-gateway:local
    build: Gateway
    environment: *gateway-env
    network_mode: service:tailscale
    volumes:
      - tailscale-socket:/var/run/tailscale:ro
      - bootstrap-state:/bootstrap:ro
      - ${INTERACTIVE_SECRET_DIR}/gateway:/secrets/gateway:ro
      - ${INTERACTIVE_SECRET_DIR}/public.json:/secrets/public.json:ro
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8030/health/ready',timeout=4)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

networks:
  control:
    external: true
    name: dml-control
volumes:
  management-state: {name: dml-interactive-management-state}
  tailscale-state: {name: dml-interactive-tailscale-state}
  tailscale-socket: {name: dml-interactive-tailscale-socket}
  bootstrap-state: {name: dml-interactive-bootstrap-state}
