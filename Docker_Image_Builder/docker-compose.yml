services:
  image-builder:
    build: .
    container_name: image-builder
    restart: always
    env_file:
      - .env
    volumes:
      # Mount the Docker socket so we can build images from inside the container
      - /var/run/docker.sock:/var/run/docker.sock
      # Mount the Scheduler's uploads directory (read-only)
      - ../Scheduler/uploads:/uploads:ro
      # Persist the processed-jobs tracker across restarts
      - builder-data:/data

volumes:
  builder-data:
