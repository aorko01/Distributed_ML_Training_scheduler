services:
  image-builder:
    build: .
    restart: always
    env_file:
      - .env
    environment:
      IMAGE_BUILDER_HEARTBEAT_INTERVAL: ${IMAGE_BUILDER_HEARTBEAT_INTERVAL:-5}
      IMAGE_BUILDER_HEARTBEAT_TIMEOUT: ${IMAGE_BUILDER_HEARTBEAT_TIMEOUT:-45}
    volumes:
      # Mount the Docker socket so we can build images from inside the container
      - /var/run/docker.sock:/var/run/docker.sock
      # Persist the processed-jobs and base-images tracker across restarts
      - builder-data:/data
      - ./debug_jobs:/app/debug_jobs   

volumes:
  builder-data:
