services:
  db:
    image: postgres:15
    container_name: app-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    ports:
      - "${DB_PORT:-5432}:5432"

  redis:
    image: redis:7
    container_name: app-redis
    restart: always
    ports:
      - "6379:6379"
    # Redis does not require environment variables by default
    # This service is needed so API can connect to host "redis"

  api:
    build: .
    container_name: app-api
    depends_on:
      - db
      - redis
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./app:/app/app
      - ./uploads:/app/uploads
      - ./output:/app/output
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-admin}@db:5432/${POSTGRES_DB:-app}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      OBJECT_STORE_URL: ${OBJECT_STORE_URL:-http://localhost:8010}
      OBJECT_STORE_BUCKET: ${OBJECT_STORE_BUCKET:-uploads}