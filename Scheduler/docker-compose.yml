services:
  db:
    image: postgres:15
    container_name: app-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"

  redis:
    image: redis:7
    container_name: app-redis
    restart: always
    ports:
      - "127.0.0.1:6379:6379"

  api:
    build: .
    container_name: app-api
    depends_on:
      - db
      - redis
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - ./app:/app/app
      - ./uploads:/app/uploads
      - ./output:/app/output
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-admin}@db:5432/${POSTGRES_DB:-app}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-your-secret-key-change-in-production}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      OBJECT_STORE_URL: ${OBJECT_STORE_URL:-http://localhost:8010}
      OBJECT_STORE_BUCKET: ${OBJECT_STORE_BUCKET:-uploads}
      OBJECT_OUTPUT_BUCKET: ${OBJECT_OUTPUT_BUCKET:-outputs}
      # Interactive sessions (SSH over Headscale tailnet)
      GATEWAY_API_URL: ${GATEWAY_API_URL:-http://gateway:8200}
      HEADSCALE_MGMT_URL: ${HEADSCALE_MGMT_URL:-http://headscale-mgmt:8100}
      HEADSCALE_MGMT_AUTH_TOKEN: ${HEADSCALE_MGMT_AUTH_TOKEN:-change-me}
      HEADSCALE_URL: ${HEADSCALE_URL:-https://headscale.zulfiker.xyz}

  # ---------------------------------------------------------------
  # Headscale management microservice: wraps pre-auth key create/revoke.
  # Requires the headscale CLI (baked into the image) or a reachable
  # HEADSCALE_API_URL.
  # ---------------------------------------------------------------
  headscale-mgmt:
    build: ../headscale_mgmt
    container_name: app-headscale-mgmt
    restart: always
    # Reached by the api over the compose network (http://headscale-mgmt:8100)
    expose:
      - "8100"
    environment:
      AUTH_TOKEN: ${HEADSCALE_MGMT_AUTH_TOKEN:-change-me}
      HEADSCALE_USER: ${HEADSCALE_USER:-sandbox}
      PREAUTH_KEY_EXPIRY: "3600"
      # Headscale control plane reached over its public HTTPS API
      HEADSCALE_API_URL: ${HEADSCALE_API_URL:-https://headscale.zulfiker.xyz}
      HEADSCALE_API_KEY: ${HEADSCALE_API_KEY:-}

  # ---------------------------------------------------------------
  # SSH Gateway: owns session SSH keys, runs its own tailscaled so it can
  # reach interactive containers over the tailnet (100.x.x.x).
  # MUST have /dev/net/tun + NET_ADMIN + NET_RAW to run tailscaled.
  # ---------------------------------------------------------------
  gateway:
    build: ../gateway
    container_name: app-gateway
    restart: always
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - gateway-keys:/data/ssh-keys
    # Reached by the api over the compose network (http://gateway:8200)
    expose:
      - "8200"
    environment:
      TAILSCALE_AUTH_KEY: ${GATEWAY_TAILSCALE_AUTH_KEY:-}
      HEADSCALE_URL: ${HEADSCALE_URL:-https://headscale.example.com}
      GATEWAY_HOSTNAME: gateway
      SSH_KEY_DIR: /data/ssh-keys

  pgadmin:
    image: dpage/pgadmin4
    container_name: app-pgadmin
    restart: always
    depends_on:
      - db
    ports:
      - "127.0.0.1:5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?set in .env}

volumes:
  gateway-keys:
