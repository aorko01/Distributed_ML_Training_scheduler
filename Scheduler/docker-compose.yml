services:
  db:
    image: postgres:15
    container_name: app-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    ports:
    - ${DB_PORT:-5432}:5432
    volumes:
    - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
  redis:
    image: redis:7
    container_name: app-redis
    restart: always
    ports:
    - 6379:6379
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 5s
      timeout: 3s
      retries: 12
  api:
    build: .
    container_name: app-api
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
    - ${API_PORT:-8000}:8000
    volumes:
    - ./app:/app/app
    - ./uploads:/app/uploads
    - ./output:/app/output
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-admin}@db:5432/${POSTGRES_DB:-app}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://distributeml.zulfiker.xyz,https://admin.zulfiker.xyz}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-20}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-20}
      DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-10}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-your-secret-key-change-in-production}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      OBJECT_STORE_URL: ${OBJECT_STORE_URL:-http://localhost:8010}
      OBJECT_STORE_BUCKET: ${OBJECT_STORE_BUCKET:-uploads}
      OBJECT_OUTPUT_BUCKET: ${OBJECT_OUTPUT_BUCKET:-outputs}
      IMAGE_BUILDER_HEARTBEAT_TIMEOUT_SECONDS: ${IMAGE_BUILDER_HEARTBEAT_TIMEOUT_SECONDS:-45}
      WATCHDOG_SCAN_INTERVAL_SECONDS: ${WATCHDOG_SCAN_INTERVAL_SECONDS:-5}
  pgadmin:
    image: dpage/pgadmin4
    container_name: app-pgadmin
    restart: always
    depends_on:
    - db
    ports:
    - 5050:80
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
volumes:
  postgres-data:
    external: true
    name: ${POSTGRES_DATA_VOLUME:-scheduler-postgres-data}
