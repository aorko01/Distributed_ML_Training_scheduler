services:
  minio:
    image: minio/minio:latest
    container_name: minio-store
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: always

  object-store:
    build: .
    container_name: object-store-api
    depends_on:
      - minio
    env_file:
      - .env
    environment:
      MINIO_ENDPOINT: minio:9000
      OBJECT_STORE_BUCKET: uploads
      OBJECT_OUTPUT_BUCKET: outputs
    ports:
      - "8010:8010"
    command: uvicorn main:app --host 0.0.0.0 --port 8010 --reload

volumes:
  minio_data:
