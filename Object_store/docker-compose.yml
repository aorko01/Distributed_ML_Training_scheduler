services:
  s3:
    image: chrislusf/seaweedfs:4.47
    container_name: object-s3
    ports:
      # Localhost-only: public traffic enters via Caddy (object.zulfiker.xyz),
      # never directly to the S3 service from other VMs.
      - "127.0.0.1:9000:9000"
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - object_data:/data
    command: server -dir=/data -ip=s3 -ip.bind=0.0.0.0 -s3 -s3.port=9000
    restart: always

  object-store:
    build: .
    container_name: object-store-api
    depends_on:
      - s3
    env_file:
      - .env
    environment:
      MINIO_ENDPOINT: s3:9000
      MINIO_SECURE: "false"
      # Routable S3 endpoint used for presigned URLs. Must NOT be
      # localhost/docker-internal: workers and browsers use these URLs.
      # Served via Caddy at https://object.zulfiker.xyz (root handle -> :9000).
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-object.zulfiker.xyz}
      MINIO_PUBLIC_SECURE: ${MINIO_PUBLIC_SECURE:-true}
      OBJECT_STORE_BUCKET: ${OBJECT_STORE_BUCKET:-uploads}
      OBJECT_OUTPUT_BUCKET: ${OBJECT_OUTPUT_BUCKET:-outputs}
    ports:
      # Localhost-only: public API traffic enters via Caddy
      # (https://object.zulfiker.xyz/objects/* -> 127.0.0.1:8010).
      - "127.0.0.1:8010:8010"
    restart: always
    command: uvicorn main:app --host 0.0.0.0 --port 8010

volumes:
  object_data:
