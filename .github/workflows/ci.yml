name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: ${{ matrix.component }} unit (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        component: ["Scheduler", "Docker_Image_Builder", "Worker"]

    defaults:
      run:
        working-directory: ${{ matrix.component }}

    env:
      DATABASE_URL: "sqlite:///:memory:"
      DOCKER_HUB_USERNAME: "ci-test-user"
      DOCKER_HUB_PASSWORD: ""
      SCHEDULER_URL: "http://localhost:8000"
      SCHEDULER_API_URL: "http://localhost:8000"
      OBJECT_STORE_URL: "http://localhost:8010"
      JWT_SECRET_KEY: "ci-test-secret-key"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            ${{ matrix.component }}/requirements.txt

      - name: Install component + test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run unit tests
        run: |
          python -m pytest test/unit/ -q

  builder-dockerhub-real-e2e:
    name: Builder real Docker Hub e2e (Python 3.11)
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    concurrency:
      group: builder-dockerhub-real-e2e
      cancel-in-progress: false
    defaults:
      run:
        working-directory: Docker_Image_Builder
    env:
      DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
      DOCKER_HUB_PASSWORD: ${{ secrets.DOCKER_HUB_PASSWORD }}
      RUN_REAL_DOCKERHUB_E2E: "1"
      SCHEDULER_API_URL: "http://localhost:8000"
      OBJECT_STORE_URL: "http://localhost:8010"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            Docker_Image_Builder/requirements.txt

      - name: Install component + test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Check Docker daemon is reachable
        run: |
          docker info
          docker version
          python -c "import docker; docker.from_env().ping(); print('daemon ping OK')"

      - name: Check Docker Hub credentials are configured
        run: |
          if [ -z "$DOCKER_HUB_USERNAME" ] || [ -z "$DOCKER_HUB_PASSWORD" ]; then
            echo "::error::DOCKER_HUB_USERNAME / DOCKER_HUB_PASSWORD secrets are not set."
            exit 1
          fi

      - name: Run real Docker Hub retry e2e
        run: |
          python -m pytest test/e2e/test_dockerhub_retry_e2e.py -v --run-real-dockerhub
