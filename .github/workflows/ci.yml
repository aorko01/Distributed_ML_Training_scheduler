name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: ${{ matrix.component }} (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        component: ["Scheduler", "Docker_Image_Builder", "Worker"]

    defaults:
      run:
        working-directory: ${{ matrix.component }}

    env:
      # Unit tests are hermetic (SQLite + mocks); these env vars only need
      # to exist so import-time config validation passes.
      DATABASE_URL: "sqlite:///:memory:"
      DOCKER_HUB_USERNAME: "ci-test-user"
      DOCKER_HUB_PASSWORD: ""
      SCHEDULER_URL: "http://localhost:8000"
      SCHEDULER_API_URL: "http://localhost:8000"
      OBJECT_STORE_URL: "http://localhost:8010"
      JWT_SECRET_KEY: "ci-test-secret-key"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            ${{ matrix.component }}/requirements.txt

      - name: Install component + test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run unit tests
        run: |
          python -m pytest tests/ -q
