name: CI

on:
  push:
    branches: ["main", "master", "codex/interactive-*"]

  pull_request:
    branches: ["main", "master"]

  workflow_dispatch:
    inputs:
      runtime_docker:
        description: Run production Docker-exec broker against a disposable CPU fixture
        type: boolean
        default: false
      interactive_registry:
        description: Run large interactive PyTorch images against Docker Hub
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------
  # UNIT TESTS
  # ------------------------------------------------------------
  unit-tests:
    name: ${{ matrix.component }} unit (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        component:
          - Scheduler
          - Docker_Image_Builder
          - Worker
          - Headscale_Management
          - Gateway
          - Access_Container

    defaults:
      run:
        working-directory: ${{ matrix.component }}

    env:
      DATABASE_URL: "sqlite:///:memory:"
      DOCKER_HUB_USERNAME: "ci-test-user"
      DOCKER_HUB_PASSWORD: ""
      SCHEDULER_URL: "http://localhost:8000"
      SCHEDULER_API_URL: "http://localhost:8000"
      OBJECT_STORE_URL: "http://localhost:8010"
      JWT_SECRET_KEY: "ci-test-secret-key"
      PYTHON_DOTENV_DISABLED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            ${{ matrix.component }}/requirements.txt

      - name: Install component + test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ -f requirements-test.txt ]; then
            pip install -r requirements-test.txt
          else
            pip install pytest pytest-asyncio httpx
          fi

      - name: Run unit tests
        run: |
          python -m pytest test/unit/ -q
          if [ "${{ matrix.component }}" = Access_Container ]; then
            timeout --kill-after=10s 120s python -m pytest test/component/ -vv -o faulthandler_timeout=30
          fi

  # ------------------------------------------------------------
  # REAL DOCKER HUB E2E TEST
  # ------------------------------------------------------------
  builder-dockerhub-real-e2e:
    name: Builder real Docker Hub e2e (Python 3.11)
    runs-on: ubuntu-latest

    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
      || (github.event_name == 'push' && github.ref == 'refs/heads/master')
      || github.event_name == 'workflow_dispatch'

    concurrency:
      group: builder-dockerhub-real-e2e
      cancel-in-progress: false

    defaults:
      run:
        working-directory: Docker_Image_Builder

    env:
      DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
      DOCKER_HUB_PASSWORD: ${{ secrets.DOCKER_HUB_PASSWORD }}
      RUN_REAL_DOCKERHUB_E2E: "1"
      RUN_INTERACTIVE_REGISTRY_E2E: ${{ inputs.interactive_registry && '1' || '0' }}
      SCHEDULER_API_URL: "http://localhost:8000"
      OBJECT_STORE_URL: "http://localhost:8010"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            Docker_Image_Builder/requirements.txt

      - name: Install component + test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Check Docker daemon is reachable
        run: |
          docker info
          docker version
          python -c "import docker; docker.from_env().ping(); print('daemon ping OK')"

      - name: Check Docker Hub credentials are configured
        run: |
          if [ -z "$DOCKER_HUB_USERNAME" ] || [ -z "$DOCKER_HUB_PASSWORD" ]; then
            echo "::error::DOCKER_HUB_USERNAME / DOCKER_HUB_PASSWORD secrets are not set."
            exit 1
          fi

      - name: Run real Docker Hub retry e2e
        run: |
          python -m pytest \
            test/e2e/test_dockerhub_retry_e2e.py \
            -v \
            --run-real-dockerhub
      - name: Run optional interactive immutable-digest registry suite
        if: inputs.interactive_registry
        run: python -m pytest test/e2e/test_interactive_registry_e2e.py -v --run-real-dockerhub

  # ------------------------------------------------------------
  # DEPLOY
  # ------------------------------------------------------------
  interactive-network-e2e:
    name: Interactive real Headscale/Tailscale e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      E2E_PROJECT: interactive-${{ github.run_id }}-${{ github.run_attempt }}
      E2E_FAILURE_PROJECT: interactive-${{ github.run_id }}-${{ github.run_attempt }}-failure
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: test/interactive_e2e/requirements.txt
      - name: Install pinned harness requirements
        run: pip install -r test/interactive_e2e/requirements.txt
      - name: Check portable Docker prerequisites
        run: |
          docker version
          docker compose version
      - name: Validate restart command contract
        run: |
          bash -n restart.sh deploy/migrate-postgres-storage.sh
          shellcheck restart.sh deploy/migrate-postgres-storage.sh
          python -m pytest test/interactive_e2e/test_restart_unit.py -q
      - name: Run complete real network suite
        run: python test/interactive_e2e/run.py --project "$E2E_PROJECT"
      - name: Verify deliberate failure, diagnostics and cleanup
        run: |
          if python test/interactive_e2e/run.py --project "$E2E_FAILURE_PROJECT" --deliberate-failure; then
            echo '::error::A deliberately failing test returned success.'
            exit 1
          fi
          python test/interactive_e2e/verify_failure.py "$E2E_FAILURE_PROJECT"
      - name: Project-scoped cleanup fallback
        if: always()
        run: |
          python test/interactive_e2e/run.py --project "$E2E_PROJECT" --cleanup
          python test/interactive_e2e/run.py --project "$E2E_FAILURE_PROJECT" --cleanup
      - name: Upload sanitized diagnostics and JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interactive-sanitized-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/interactive-*/
          retention-days: 7
          if-no-files-found: error

  interactive-postgres:
    name: Interactive additive PostgreSQL migration and concurrent claims
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: interactive_test
          POSTGRES_PASSWORD: isolated_ci_password
          POSTGRES_DB: interactive_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U interactive_test" --health-interval 5s --health-timeout 3s --health-retries 12
    defaults:
      run:
        working-directory: Scheduler
    env:
      DATABASE_URL: postgresql://interactive_test:isolated_ci_password@localhost:5432/interactive_test
      JWT_SECRET_KEY: isolated-ci-test-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python test/postgres/check_interactive.py
      - run: python test/postgres/check_runtime.py

  interactive-runtime-docker:
    name: Production Docker exec broker (CPU fixture)
    if: github.event_name == 'workflow_dispatch' && inputs.runtime_docker
    runs-on: ubuntu-latest
    env:
      PYTHON_DOTENV_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime broker dependencies
        run: |
          python -m venv /tmp/runtime-broker-venv
          /tmp/runtime-broker-venv/bin/pip install -r Worker/requirements.txt
      - name: Disposable digest registry and real host broker gate
        shell: bash
        run: |
          set -euo pipefail
          DML_FIXTURE_REGISTRY="runtime-registry-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          DML_REGISTRY_ID=$(docker run -d --name "$DML_FIXTURE_REGISTRY" -p 127.0.0.1:55079:5000 registry:2.8.3@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373)
          trap 'docker rm -f "$DML_REGISTRY_ID" >/dev/null' EXIT
          docker build -t localhost:55079/workload:fixture test/interactive_e2e/runtime
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:55079/v2/ >/dev/null; then break; fi
            sleep 1
          done
          docker push localhost:55079/workload:fixture
          RUNTIME_FIXTURE_DIGEST=$(docker image inspect localhost:55079/workload:fixture --format '{{index .RepoDigests 0}}')
          export RUNTIME_FIXTURE_DIGEST
          sudo --preserve-env=RUNTIME_FIXTURE_DIGEST,PYTHON_DOTENV_DISABLED /tmp/runtime-broker-venv/bin/python test/interactive_e2e/runtime/check_broker.py

  deploy:
    name: Deploy Distributed ML System

    needs:
      - unit-tests
      - builder-dockerhub-real-e2e
      - interactive-network-e2e
      - interactive-postgres

    # Only deploy for pushes to main/master, or a manual workflow run.
    # Pull requests will run CI but will NOT deploy.
    if: >
      success() &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
        github.event_name == 'workflow_dispatch'
      )

    runs-on:
      - self-hosted
      - macOS

    concurrency:
      group: production-deployment
      cancel-in-progress: false

    steps:
      - name: Show deployment information
        run: |
          echo "Commit: $GITHUB_SHA"
          echo "Branch: $GITHUB_REF"
          echo "Triggered by: $GITHUB_ACTOR"
          echo "Runner: $RUNNER_NAME"
          echo "Host: $(hostname)"
          echo "User: $(whoami)"

      - name: Verify deployment script exists
        run: |
          test -f "$HOME/Desktop/github-deploy/deploy.sh"
          test -x "$HOME/Desktop/github-deploy/deploy.sh"

      - name: Deploy
        run: |
          "$HOME/Desktop/github-deploy/deploy.sh"
